<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Academy</title>
    <style>
        :root {
            --bg-color: #111116;
            --card-bg: #1B1E29;
            --accent-color: #FF00FF;
            --text-color: #FFFFFF;
            --secondary-text: #8E9099;
            --live-color: #FF3344;
            --border-gradient: linear-gradient(90deg, #FF00FF, #00FFFF, #FF9900);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
        }

        .live-badge {
            background-color: var(--live-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #2D3142;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-info {
            padding: 15px;
        }

        .card-info h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .card-info p {
            color: var(--secondary-text);
            font-size: 14px;
        }

        .carousel-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            scroll-snap-type: x mandatory;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            min-width: 150px;
            scroll-snap-align: center;
            overflow: hidden;
            border: 1px solid transparent;
            transition: border 0.3s;
        }
        
        .card:hover {
            border: 1px solid var(--accent-color);
        }

        .thumbnail-wrapper {
            position: relative;
            height: 100px;
            background-color: #2D3142;
        }

        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-overlay img {
            width: 40px;
            height: 40px;
        }

        .item-info {
            padding: 10px;
        }

        .item-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-duration {
            color: var(--secondary-text);
            font-size: 11px;
        }

    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Crypto Academy</div>
            <span class="live-badge">Live</span>
        </header>

        <div class="video-card">
            <div class="video-wrapper">
                <iframe id="main-player" src="https://www.youtube.com/embed/VIDEO_ID_1" allowfullscreen></iframe>
            </div>
            <div class="card-info">
                <h2 id="main-title">DeFi Principles</h2>
                <p>Blockchain Fundamentals</p>
            </div>
        </div>

        <h3>Featured Lessons</h3>
        <br>
        <div class="carousel-container">
            <div class="card" onclick="changeVideo('VIDEO_ID_1', 'DeFi Principles')">
                <div class="thumbnail-wrapper">
                    <img src="https://img.youtube.com/vi/VIDEO_ID_1/hqdefault.jpg" alt="Thumbnail 1">
                    <div class="video-overlay"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube"></div>
                </div>
                <div class="item-info">
                    <div class="item-title">1. Intro to Bitcoin</div>
                    <div class="item-duration">10:24</div>
                </div>
            </div>

            <div class="card" onclick="changeVideo('VIDEO_ID_2', 'Trading Pairs Analysis')">
                <div class="thumbnail-wrapper">
                    <img src="https://img.youtube.com/vi/VIDEO_ID_2/hqdefault.jpg" alt="Thumbnail 2">
                    <div class="video-overlay"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube"></div>
                </div>
                <div class="item-info">
                    <div class="item-title">2. Trading Pairs</div>
                    <div class="item-duration">14:15</div>
                </div>
            </div>

            <div class="card" onclick="changeVideo('VIDEO_ID_3', 'Altcoin Analysis Strategies')">
                <div class="thumbnail-wrapper">
                    <img src="https://img.youtube.com/vi/VIDEO_ID_3/hqdefault.jpg" alt="Thumbnail 3">
                    <div class="video-overlay"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube"></div>
                </div>
                <div class="item-info">
                    <div class="item-title">3. Altcoin Analysis</div>
                    <div class="item-duration">11:50</div>
                </div>
            </div>

            <div class="card" onclick="changeVideo('VIDEO_ID_4', 'Advanced Technical Analysis')">
                <div class="thumbnail-wrapper">
                    <img src="https://img.youtube.com/vi/VIDEO_ID_4/hqdefault.jpg" alt="Thumbnail 4">
                    <div class="video-overlay"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube"></div>
                </div>
                <div class="item-info">
                    <div class="item-title">4. Advanced TA</div>
                    <div class="item-duration">16:30</div>
                </div>
            </div>

            <div class="card" onclick="changeVideo('VIDEO_ID_5', 'Futures Basics')">
                <div class="thumbnail-wrapper">
                    <img src="https://img.youtube.com/vi/VIDEO_ID_5/hqdefault.jpg" alt="Thumbnail 5">
                    <div class="video-overlay"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube"></div>
                </div>
                <div class="item-info">
                    <div class="item-title">5. Futures Basics</div>
                    <div class="item-duration">12:10</div>
                </div>
            </div>
            
            <div class="card" onclick="changeVideo('VIDEO_ID_6', 'Risk Management')">
                <div class="thumbnail-wrapper">
                    <img src="https://img.youtube.com/vi/VIDEO_ID_6/hqdefault.jpg" alt="Thumbnail 6">
                    <div class="video-overlay"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube"></div>
                </div>
                <div class="item-info">
                    <div class="item-title">6. Risk Management</div>
                    <div class="item-duration">15:00</div>
                </div>
            </div>

            <div class="card" onclick="changeVideo('VIDEO_ID_7', 'Understanding Candlesticks')">
                <div class="thumbnail-wrapper">
                    <img src="https://img.youtube.com/vi/VIDEO_ID_7/hqdefault.jpg" alt="Thumbnail 7">
                    <div class="video-overlay"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube"></div>
                </div>
                <div class="item-info">
                    <div class="item-title">7. Candlesticks</div>
                    <div class="item-duration">18:45</div>
                </div>
            </div>

            <div class="card" onclick="changeVideo('VIDEO_ID_8', 'Understanding Wallets')">
                <div class="thumbnail-wrapper">
                    <img src="https://img.youtube.com/vi/VIDEO_ID_8/hqdefault.jpg" alt="Thumbnail 8">
                    <div class="video-overlay"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube"></div>
                </div>
                <div class="item-info">
                    <div class="item-title">8. Web3 Wallets</div>
                    <div class="item-duration">13:20</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        function changeVideo(videoId, title) {
            document.getElementById('main-player').src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1';
            document.getElementById('main-title').innerText = title;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
