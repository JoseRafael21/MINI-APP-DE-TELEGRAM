<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Academy - Inmersivo</title>
    <style>
        :root {
            --bg-color: #111216;
            --card-bg: #1c1f26;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --secondary-text: #8e9099;
            --live-color: #ff3344;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 20px;
            font-weight: bold;
        }
        .live-badge {
            background-color: var(--live-color);
            color: var(--text-color);
            font-size: 12px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .main-video-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-info {
            padding: 15px;
        }
        .video-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .chart-placeholder {
            background-color: #16181e;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .chart-label {
            font-size: 14px;
            color: var(--secondary-text);
            margin-bottom: 8px;
        }
        .chart-viz {
            height: 80px;
            background: linear-gradient(90deg, #1c1f26 0%, #2c303b 50%, #1c1f26 100%);
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .chart-viz::after {
            content: '';
            position: absolute;
            bottom: 30%;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
        }
        .carousel-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 0;
            scrollbar-width: none;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-item {
            flex: 0 0 120px;
            background-color: #1a1c22;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        /* Bordes de neón para cada tarjeta */
        .card-1 { border-color: #ff9900; box-shadow: 0 0 10px #ff9900; }
        .card-2 { border-color: #00aaff; box-shadow: 0 0 10px #00aaff; }
        .card-3 { border-color: #aa00ff; box-shadow: 0 0 10px #aa00ff; }
        .card-4 { border-color: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .card-5 { border-color: #ff3344; box-shadow: 0 0 10px #ff3344; }

        .thumbnail-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }
        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .item-info {
            padding: 10px;
            text-align: center;
        }
        .item-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-duration {
            color: var(--secondary-text);
            font-size: 11px;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header>
        <h1>Crypto Academy</h1>
        <span class="live-badge">LIVE</span>
    </header>

    <div class="main-video-container">
        <div class="video-wrapper">
            <iframe id="main-player" src="https://www.youtube.com/embed/VIDEO_ID_1" allowfullscreen></iframe>
        </div>
        <div class="video-info">
            <div id="main-title" class="video-title">Blockchain Fundamentals</div>
            <div class="chart-placeholder">
                <div class="chart-label">DeFi Principles</div>
                <div class="chart-viz"></div>
            </div>
        </div>
    </div>

    <div class="carousel-container">
        <div class="carousel-item card-1" onclick="changeVideo('VIDEO_ID_1', 'Intro to Bitcoin')">
            <div class="thumbnail-wrapper"><img src="https://img.youtube.com/vi/VIDEO_ID_1/mqdefault.jpg" alt="Thumbnail"></div>
            <div class="item-info">
                <div class="item-title">Intro to Bitcoin</div>
                <div class="item-duration">10:24</div>
            </div>
        </div>
        <div class="carousel-item card-2" onclick="changeVideo('VIDEO_ID_2', 'Trading Pairs')">
            <div class="thumbnail-wrapper"><img src="https://img.youtube.com/vi/VIDEO_ID_2/mqdefault.jpg" alt="Thumbnail"></div>
            <div class="item-info">
                <div class="item-title">Trading Pairs</div>
                <div class="item-duration">14:15</div>
            </div>
        </div>
        <div class="carousel-item card-3" onclick="changeVideo('VIDEO_ID_3', 'Altcoin Analysis')">
            <div class="thumbnail-wrapper"><img src="https://img.youtube.com/vi/VIDEO_ID_3/mqdefault.jpg" alt="Thumbnail"></div>
            <div class="item-info">
                <div class="item-title">Altcoin Analysis</div>
                <div class="item-duration">11:50</div>
            </div>
        </div>
        <div class="carousel-item card-4" onclick="changeVideo('VIDEO_ID_4', 'Advanced TA')">
            <div class="thumbnail-wrapper"><img src="https://img.youtube.com/vi/VIDEO_ID_4/mqdefault.jpg" alt="Thumbnail"></div>
            <div class="item-info">
                <div class="item-title">Advanced TA</div>
                <div class="item-duration">16:30</div>
            </div>
        </div>
        <div class="carousel-item card-5" onclick="changeVideo('VIDEO_ID_5', 'Futures Basics')">
            <div class="thumbnail-wrapper"><img src="https://img.youtube.com/vi/VIDEO_ID_5/mqdefault.jpg" alt="Thumbnail"></div>
            <div class="item-info">
                <div class="item-title">Futures Basics</div>
                <div class="item-duration">12:10</div>
            </div>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        function changeVideo(videoId, title) {
            document.getElementById('main-player').src = `https://www.youtube.com/embed/${videoId}`;
            document.getElementById('main-title').innerText = title;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
