<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Academy</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0f19; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; padding: 20px; text-align: center; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-weight: bold; color: #4a90e2; font-size: 20px; }
        .badge { background: linear-gradient(90deg, #4a90e2, #9b51e0); padding: 5px 10px; border-radius: 15px; font-size: 12px; }
        .carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 15px; padding-bottom: 20px; }
        .video-card { scroll-snap-align: center; flex: 0 0 80%; background-color: #1a2035; border-radius: 15px; overflow: hidden; border: 1px solid #4a90e2; box-shadow: 0 4px 15px rgba(155, 81, 224, 0.3); }
        video { width: 100%; height: 200px; object-fit: cover; }
        .card-info { padding: 15px; text-align: left; }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #fff; }
        p { color: #a0aec0; font-size: 14px; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Crypto Academy</div>
            <div class="badge">Premium</div>
        </header>
        <h1>Lecciones Destacadas</h1>
        <div class="carousel">
            <div class="video-card">
                <video controls>
                    <source src="El_hombre_de_la_fotografía_cam.mp4" type="video/mp4">
                    <source src="video1.mp4" type="video/mp4">
                    <source src="video1.mp4" type="video/mp4">
                    Tu navegador no soporta video.
                </video>
                <div class="card-info">
                    <h2>Fundamentos de Bitcoin</h2>
                    <p>Aprende las bases de la criptomoneda.</p>
                </div>
            </div>
            <div class="video-card">
                <video controls>
                    <source src="video2.mp4" type="video/mp4">
                    Tu navegador no soporta video.
                </video>
                <div class="card-info">
                    <h2>Ecosistema DeFi</h2>
                    <p>Descubre las finanzas descentralizadas.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
